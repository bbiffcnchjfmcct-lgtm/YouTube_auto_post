name: Auto YouTube News Post
on:
schedule:
- cron: '0 2 * * *' # रोज सुबह 10:00 AM IST पर चलेगा
workflow_dispatch: # मैनुअल रन के लिए
jobs:
build-and-upload:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
- name: Install Dependencies
run: |
sudo apt-get update
sudo apt-get install -y ffmpeg imagemagick fonts-dejavu fonts-dejavu-core
sudo sed -i 's/policy domain="path" rights="none" pattern="@*"/policy domain="path" rights="read|write" pattern="@*"/g' /etc/ImageMagick-6/policy.xml
python -m pip install --upgrade pip
pip install -r requirements.txt
- name: Run Auto Post Script
env:
CLIENT_ID: ${{ secrets.CLIENT_ID }}
CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
run: python main.py
